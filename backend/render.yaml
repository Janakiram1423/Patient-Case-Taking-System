services:
  - type: web
    name: clinicase-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: clinicase_db
      - key: CORS_ORIGINS
        value: "*"
